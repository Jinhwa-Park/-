<!doctype html>
<html lang="ko">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>메뉴 가격 조회 · 도와줘요 셰프님!</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f6ee;color:#302b25;font:16px/1.6 "Apple SD Gothic Neo","Malgun Gothic",sans-serif}main{max-width:560px;margin:8vh auto;padding:28px}header{color:#49654d;font-weight:bold}h1{font-size:32px;margin:12px 0 26px;letter-spacing:-.06em}label{display:block;font-weight:bold}input,button{font:inherit;border-radius:8px;padding:12px 14px}input{width:100%;border:1px solid #9b9e91;margin:6px 0 12px}button{background:#32573c;color:white;border:0;cursor:pointer;width:100%}output{display:block;margin-top:24px}output:not(:empty){border-top:1px solid #d4d2c3;padding-top:16px}strong{display:block;font-size:30px}
</style>
<main><header>도와줘요 셰프님!</header><h1>메뉴 가격 조회</h1>
<form><label for="menu">메뉴명</label><input id="menu" placeholder="예: 새우볶음밥" list="menus" required><datalist id="menus"></datalist><button>기준 가격 조회</button></form>
<output aria-live="polite"></output></main>
<script>
const prices = /*PRICE_TABLE*/{};
const menu = document.querySelector("#menu");
const result = document.querySelector("output");
const choices = document.querySelector("#menus");
for (const name of Object.keys(prices).sort((a,b)=>a.localeCompare(b,"ko"))) {
  const option = document.createElement("option");
  option.value = name;
  choices.append(option);
}
menu.addEventListener("input", () => result.replaceChildren());
document.querySelector("form").addEventListener("submit", event => {
  event.preventDefault();
  const name = menu.value.normalize("NFC").replace(/\s+/g,"").toLowerCase();
  if (!Object.prototype.hasOwnProperty.call(prices,name)) {
    result.textContent = "기준표에 등록된 메뉴를 찾지 못했습니다.";
    return;
  }
  const amount = document.createElement("strong");
  amount.textContent = prices[name].toLocaleString("ko-KR") + "원";
  result.replaceChildren(name + " · 기준 가격", amount);
});
</script>
</html>
