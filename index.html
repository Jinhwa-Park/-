<!doctype html>
<html lang="ko">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>메뉴 가격 조회 · 도와줘요 셰프님!</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f8f6ee;color:#302b25;font:16px/1.6 "Apple SD Gothic Neo","Malgun Gothic",sans-serif}main{max-width:560px;margin:8vh auto;padding:28px}header{color:#49654d;font-weight:bold}h1{font-size:32px;margin:12px 0 26px;letter-spacing:-.06em}label{display:block;font-weight:bold}input,button{font:inherit;border-radius:8px;padding:12px 14px}input{width:100%;border:1px solid #9b9e91;margin:6px 0 12px}button{background:#32573c;color:white;border:0;cursor:pointer;width:100%}#result{margin-top:24px}#result:not(:empty){border-top:1px solid #d4d2c3;padding-top:16px}strong{display:block;font-size:30px}
</style>
<style>
  main.seoul{max-width:760px;margin:5vh auto} [hidden]{display:none!important}
  #servings{max-width:9rem} .source,.details,.offer-change{font-size:.9rem;color:#4d594d}
  .offer-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;list-style:none;padding:0}
  .offer-grid li{border:1px solid #bbc5b4;border-radius:10px;background:#fffdf6;padding:12px;min-width:0}
  .offer-grid strong{font-size:1.35rem;letter-spacing:-.03em}.price-row{padding:.45rem 0;border-bottom:1px solid #e0ded1}
  .price-row b{overflow-wrap:anywhere} .price-list{list-style:none;padding:0} .price-list p{margin:.15rem 0}
  .seoul h2{font-size:1.18rem;margin:1.25rem 0 .4rem}.quote-summary>p{margin:.35rem 0}
  .recipe-summary,.recipe-inputs{border:1px solid #bbc5b4;border-radius:10px;background:#fffdf6;padding:12px 16px}
  .recipe-summary p{margin:.2rem 0}.recipe-summary summary{margin-top:.6rem;cursor:pointer;font-weight:bold}
  .recipe-summary a{color:#32573c;text-underline-offset:.15em}
  .recipe-inputs{margin-top:12px}.recipe-inputs summary{cursor:pointer;font-weight:bold}
  .recipe-inputs fieldset{border:0;padding:0;margin:0 0 .5rem;min-width:0}.recipe-inputs legend{font-weight:bold}
  .recipe-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr));gap:0 12px}
  .recipe-fields label,.recipe-confirm{font-size:.9rem;font-weight:normal}.recipe-fields input{background:white;margin:.2rem 0 .6rem}
  .recipe-confirm{display:flex;align-items:baseline;gap:.5rem}.recipe-confirm input{width:auto;margin:0;accent-color:#32573c}
  .public-ingredients{white-space:pre-wrap;overflow-wrap:anywhere}
  .public-quote-form fieldset{margin:0}.public-quote-form button{margin:0 0 .5rem}
  .public-quote-form .recipe-fields label{font-size:.88rem}.public-quote-form .recipe-fields input{padding:.5rem .7rem}
  .recipe-summary select{display:block;width:100%;font:inherit;padding:.5rem;margin:.25rem 0 .65rem;border:1px solid #9b9e91;border-radius:8px;background:white}
  .offer-hold{color:#714a21;font-size:.95rem}
</style>
<main><header>도와줘요 셰프님!</header><h1>메뉴 가격 조회</h1>
<form><label for="menu">메뉴명</label><input id="menu" placeholder="예: 새우볶음밥" list="menus" maxlength="200" required><datalist id="menus"></datalist>
<div id="serving-field" hidden><label for="servings">주문 인분</label><input id="servings" type="number" min="1" max="100" step="1" value="1" aria-describedby="servings-help" required><p id="servings-help" class="details">주문할 수량은 이 칸에 입력해 주세요.</p></div>
<button>가격 조회</button></form>
<p id="source" class="source" hidden></p>
<div id="result"></div></main>
<script>
/*SEOUL_OFFER_CODE*/
const seoulData = /*SEOUL_PRICE_DATA*/null;
const recipeData = /*RECIPE_PRICE_DATA*/null;
const prices = /*PRICE_TABLE*/{};
const menu = document.querySelector("#menu");
const result = document.querySelector("#result");
const choices = document.querySelector("#menus");
const form = document.querySelector("form");
const servings = document.querySelector("#servings");
const names = seoulData ? [...new Set([
  ...Object.values(seoulData.menus).map(entry => entry.name), ...Object.keys(recipeData?.menus ?? {}),
  ...Object.values(recipeData?.public?.entries ?? {}).map(records => records[0].name),
])] : Object.keys(prices);
const options = document.createDocumentFragment();
for (const name of names.sort((a,b)=>a.localeCompare(b,"ko"))) {
  const option = document.createElement("option");
  option.value = name;
  options.append(option);
}
choices.append(options);
menu.addEventListener("input", () => result.replaceChildren());
if (seoulData) {
  document.querySelector("main").classList.add("seoul");
  document.querySelector("h1").textContent = "메뉴 가격 · 오퍼 조회";
  document.querySelector("button").textContent = "가격과 오퍼 조회";
  document.querySelector("#serving-field").hidden = false;
  const source = document.querySelector("#source");
  source.textContent = "출처 · " + seoulData.source;
  source.hidden = false;
  servings.addEventListener("input", () => result.replaceChildren());
} else {
  result.setAttribute("aria-live", "polite");
}
form.addEventListener("submit", event => {
  event.preventDefault();
  if (seoulData) {
    renderSeoul(menu.value, servings.valueAsNumber);
    return;
  }
  const name = menu.value.normalize("NFC").replace(/\s+/g,"").toLowerCase();
  if (!Object.prototype.hasOwnProperty.call(prices,name)) {
    result.textContent = "기준표에 등록된 메뉴를 찾지 못했습니다.";
    return;
  }
  const entry = prices[name];
  result.textContent = name;
  if (entry.price !== undefined) {
    const amount = document.createElement("strong");
    amount.textContent = entry.price.toLocaleString("ko-KR") + "원";
    const basis = document.createElement("div");
    basis.textContent = "기준 가격 · " + entry.basis;
    result.append(amount, basis);
  } else {
    const status = document.createElement("p");
    status.textContent = "1인분 기준가 미확정";
    result.append(status);
  }
  if (entry.observations?.length) {
    const heading = document.createElement("h2");
    heading.textContent = "매장별 게시 가격";
    const list = document.createElement("ul");
    for (const [price, units, store] of entry.observations) {
      const row = document.createElement("li");
      row.textContent = [price.toLocaleString("ko-KR") + "원", units, store].filter(Boolean).join(" · ");
      list.append(row);
    }
    result.append(heading, list);
  }
});

const money = value => value.toLocaleString("ko-KR") + "원";
const percent = new Intl.NumberFormat("ko-KR", {style: "percent", signDisplay: "exceptZero", maximumFractionDigits: 1});

function line(tag, value, className = "") {
  const element = document.createElement(tag);
  element.className = className;
  element.textContent = value;
  return element;
}

function priceRow(name, reference, reason) {
  const item = document.createElement("li");
  item.className = "price-row";
  item.append(line("b", `${name} · ${money(reference.price)}`));
  item.append(line("p", [reference.unit, reference.composition, reference.sample,
    `${reference.stores}곳`, reference.districts, reason].filter(Boolean).join(" · "), "details"));
  return item;
}

function sourceLink(label, href) {
  if (!href?.startsWith("https://")) return line("span", label);
  const link = line("a", label);
  link.href = href;
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  return link;
}

function renderRecipe({recipe, breakdown}) {
  const section = document.createElement("section");
  section.className = "recipe-summary";
  const type = recipe.method === "recipe" ? "등록 레시피" : "유사 레시피";
  section.append(line("b", `${type} · ${recipe.name}`));
  const {food, labor, packaging, markup_amount, minutes, work, total} = breakdown;
  const markup = `${recipeData.policy.markup * 100}%`;
  const price = total === null ? "" : `${money(total)} · `;
  const laborCost = labor === null ? "입력 필요" : money(labor);
  section.append(line("p", `${price}재료비 ${money(food)} + 인건비 ${laborCost} + 용기비 ${money(packaging)} + 재료비 가산(${markup}) ${money(markup_amount)}`));
  if (minutes === null) {
    section.append(line("p", "직접 작업시간을 입력하면 인건비와 견적을 계산해요.", "details"));
  } else {
    const shownMinutes = minutes.toLocaleString("ko-KR", {maximumFractionDigits: 2});
    section.append(line("p", work
      ? `입력한 직접 작업시간 ${shownMinutes}분 · 준비·정리 ${work.prepMinutes}분 + ${work.batches}회 × ${work.batchMinutes}분`
      : `가정한 직접 작업시간 ${shownMinutes}분`, "details"));
  }
  const details = document.createElement("details");
  details.append(line("summary", "재료별 금액과 출처"));
  const items = line("ul", "", "price-list");
  for (const entry of breakdown.lines) {
    const item = line("li", "", "price-row");
    const label = entry.quantity == null ? entry.item : `${entry.item} ${entry.quantity}${entry.unit}`;
    item.append(line("b", `${label} · ${money(entry.cost)}`));
    const pack = recipeData.packages[entry.item];
    if (entry.purchase) {
      item.append(line("p", `입력한 매입가 ${money(entry.purchase.price)} · 사용 가능량 ${entry.purchase.usableAmount}${entry.unit}`, "details"));
    } else if (pack) {
      const source = line("p", "", "details");
      source.append(sourceLink(`${pack.product} ${pack.size}${pack.unit} · ${money(pack.won)} · ${pack.date} 소매 표시가`, pack.url));
      item.append(source);
    } else if (entry.samples) {
      item.append(line("p", `양념 레시피 ${entry.samples}건의 1인 비용 중앙값 적용`, "details"));
    }
    items.append(item);
  }
  details.append(items);
  details.append(line("b", "기본값의 근거"));
  for (const assumption of recipe.assumptions) details.append(line("p", assumption, "details"));
  const sources = line("ul", "", "details");
  for (const [i, href] of recipe.sources.entries()) {
    const item = line("li", "");
    item.append(sourceLink(`레시피 출처 ${i + 1}`, href));
    sources.append(item);
  }
  details.append(sources);
  section.append(details);
  return section;
}

function numberField(group, caption, min, step = "any", initial = "") {
  const label = line("label", caption);
  const input = document.createElement("input");
  Object.assign(input, {type: "number", min, step, value: initial});
  label.append(input);
  group.append(label);
  return () => input.validity.valid ? input.valueAsNumber : NaN;
}

function inputGroup(container, title) {
  const fieldset = document.createElement("fieldset");
  const fields = line("div", "", "recipe-fields");
  fieldset.append(line("legend", title), fields);
  container.append(fieldset);
  return fields;
}

function workFields(panel) {
  const work = inputGroup(panel, "직접 작업시간");
  const prep = numberField(work, "주문당 준비·정리(분)", "0");
  const batch = numberField(work, "한 번 조리할 때 걸리는 시간(분)", "0");
  const capacity = numberField(work, "한 번에 조리하는 인분", "1", "1");
  return () => ({prepMinutes: prep(), batchMinutes: batch(), servingsPerBatch: capacity()});
}

function recipeConfirmation(panel) {
  const label = line("label", "", "recipe-confirm");
  const confirmed = document.createElement("input");
  confirmed.type = "checkbox";
  label.append(confirmed, "이 주문에 사용할 레시피의 재료와 분량을 확인했어요.");
  panel.append(label);
  return () => confirmed.checked;
}

function renderRecipeInputs(recipe, update) {
  const panel = line("details", "", "recipe-inputs");
  panel.append(line("summary", "실측 작업시간·실제 매입가 입력"));
  panel.append(line("p", "입력값은 이 주문에 적용돼요. 작업시간에는 손이 필요한 시간만 넣어 주세요.", "details"));
  const work = workFields(panel);
  const purchases = recipe.primaryIngredients.map(item => {
    const group = inputGroup(panel, item);
    const price = numberField(group, "실제 구매 금액(원)", "1", "1");
    const usable = numberField(group, `손질 후 사용 가능량(${recipeData.packages[item].unit})`, "0");
    return () => [item, {price: price(), usableAmount: usable()}];
  });
  const confirmed = recipeConfirmation(panel);
  panel.addEventListener("input", () => update({
    work: work(),
    purchases: Object.fromEntries(purchases.map(read => read())),
    confirmed: confirmed(),
  }));
  return panel;
}

function renderPublicRecipes(records, count, needsOffer, update) {
  const section = line("section", "", "recipe-summary");
  const content = document.createElement("div");
  function selectRecipe(record) {
    content.replaceChildren();
    if (!record) {
      update?.({});
      return;
    }
    content.append(line("p", [record.category, record.method, record.servings ? `원본 ${record.servings}인분` : "원본 인분 확인 필요",
      `일련번호 ${record.id}`].filter(Boolean).join(" · "), "details"));
    const ingredients = line("p", record.ingredients || "원본에 재료 정보가 없어요.", "public-ingredients");
    if (!update || !record.ingredients) {
      content.append(ingredients);
      update?.({publicRecipeId: record.id});
      return;
    }
    const displayed = line("p", "", "details");
    displayed.setAttribute("aria-live", "polite");
    const panel = line("form", "", "public-quote-form");
    panel.append(line("p", `작업시간은 이번 ${count}인분 주문을 만드는 데 손이 필요한 전체 시간으로 입력해 주세요.`, "details"));
    const costs = inputGroup(panel, "견적 입력");
    const portions = numberField(costs, "원본 분량의 인분", "1", "1", record.servings ?? "");
    const price = numberField(costs, "해당 분량의 전체 재료비(원)", "1", "1");
    const minutes = numberField(costs, "주문 전체 직접 작업시간(분)", "0.1");
    for (const input of costs.querySelectorAll("input")) input.required = true;
    const calculate = line("button", needsOffer ? "오퍼 가격 계산" : "레시피 견적 계산");
    calculate.type = "submit";
    panel.append(calculate, displayed);
    const refresh = confirmed => {
      const quote = update({publicRecipeId: record.id, sourceServings: portions(), batchCost: price(),
        directMinutes: minutes(), confirmed});
      displayed.textContent = [
        quote?.food != null ? `주문 재료비 ${money(quote.food)} · 가산액 ${money(quote.markup)}` : "",
        quote?.work ? `직접 작업시간 ${quote.work.minutes.toLocaleString("ko-KR", {maximumFractionDigits: 2})}분 · 인건비 ${money(quote.work.labor)}` : "",
        quote?.total != null ? `레시피 잠정가 ${money(quote.total)}` : "",
      ].filter(Boolean).join(" · ");
    };
    panel.addEventListener("input", () => refresh(false));
    panel.addEventListener("submit", event => {
      event.preventDefault();
      refresh(true);
    });
    content.append(panel, ingredients);
    refresh(false);
  }
  if (records.length > 1) {
    const label = line("label", "원본 레시피 선택");
    const choices = document.createElement("select");
    choices.id = "public-recipe-variant";
    label.htmlFor = choices.id;
    choices.append(new Option("같은 이름의 레시피 중 선택", ""));
    for (const record of records) {
      const details = [record.name, record.category, record.method, record.id].filter(Boolean).join(" · ");
      choices.append(new Option(details, record.id));
    }
    choices.addEventListener("change", () => selectRecipe(records.find(record => record.id === choices.value)));
    section.append(label, choices);
  } else {
    selectRecipe(records[0]);
  }
  const source = line("p", "", "details");
  source.append(sourceLink("출처 · 식품의약품안전처 조리식품의 레시피 DB (COOKRCP01)", recipeData.public.source));
  section.append(content, source);
  return section;
}

function renderQuote(summary, estimate, count) {
  const {market: {basis}, marketTotal, recipeQuote, publicQuote, total, offerTotal, method} = estimate;
  const recipe = method === "recipe" || method === "public_recipe";
  summary.replaceChildren();
  if (total !== null) {
    const labels = {market_exact: "동일 메뉴 시세 기준가", recipe: "레시피 잠정가",
      public_recipe: "식약처 레시피 잠정가", market_estimate: "유사 메뉴 시세 참고가"};
    summary.append(line("p", labels[method]), line("strong", money(total)));
    if (recipe) {
      const evidence = offerTotal === null ? "" : " · 재료비와 직접 작업시간 입력값 반영";
      summary.append(line("p", `${count}인분 주문${evidence}`, "details"));
    } else {
      const evidence = method === "market_exact" ? basis.reference.unit : `유사한 단품 ${basis.count}종의 1인 가격 중앙값`;
      summary.append(line("p", `${money(basis.price)} × ${count}인분 · ${evidence}`, "details"));
    }
  }
  if (recipe && marketTotal !== null) {
    summary.append(line("p", `유사 메뉴 시세 참고가 ${money(marketTotal)}`, "details"));
  }
  if (offerTotal === null) {
    const awaitingPublicSubmit = method === "public_recipe" && total !== null;
    const reason = awaitingPublicSubmit ? "아래에서 ‘오퍼 가격 계산’을 눌러 주세요." :
      recipe ? `${(recipeQuote ?? publicQuote).missing.join(", ")} 필요` :
      method === "market_estimate" ? "동일 메뉴 시세 또는 확인된 레시피 입력값 필요" : "비교할 시세와 레시피 근거 부족";
    summary.append(line("p", `오퍼 보류 · ${reason}`, "offer-hold"));
    return;
  }
  const quotes = SeoulOffers.offers(offerTotal);
  if (quotes.length) {
    summary.append(line("h2", "실험용 오퍼"));
    const list = line("ul", "", "offer-grid");
    for (const offer of quotes) {
      const item = document.createElement("li");
      item.append(line("span", offer.label), line("strong", money(offer.price)),
        line("span", percent.format(offer.change), "offer-change"));
      list.append(item);
    }
    summary.append(list);
  }
}

function renderSeoul(query, count) {
  const estimate = SeoulOffers.estimate(seoulData, recipeData, query, count);
  const {exact, references, similar, basis} = estimate.market;
  const summary = line("section", "", "quote-summary");
  summary.setAttribute("aria-live", "polite");
  summary.tabIndex = -1;
  renderQuote(summary, estimate, count);
  result.replaceChildren(summary);
  if (estimate.recipeQuote) {
    const breakdown = document.createElement("div");
    const showBreakdown = ({recipeQuote, marketTotal, method}) => {
      breakdown.replaceChildren(renderRecipe(recipeQuote));
      if (method === "market_exact" && recipeQuote.breakdown.total !== null) {
        const difference = (recipeQuote.breakdown.total - marketTotal) / marketTotal;
        breakdown.append(line("p", `동일 메뉴 시세 대비 ${percent.format(difference)}`, "details"));
      }
    };
    showBreakdown(estimate);
    const inputs = renderRecipeInputs(estimate.recipeQuote.recipe, values => {
      const adjusted = SeoulOffers.estimate(seoulData, recipeData, query, count, values);
      if (adjusted.method === "recipe") renderQuote(summary, adjusted, count);
      showBreakdown(adjusted);
    });
    inputs.open = estimate.offerTotal === null;
    result.append(line("h2", "레시피 견적 내역"), breakdown, inputs);
  }
  if (estimate.publicRecipes.length) {
    const update = estimate.recipeQuote ? null : values => {
      const adjusted = SeoulOffers.estimate(seoulData, recipeData, query, count, values);
      if (adjusted.method === "public_recipe") {
        renderQuote(summary, adjusted, count);
        if (values.confirmed && adjusted.offerTotal !== null) summary.focus();
      }
      return adjusted.publicQuote;
    };
    result.append(line("h2", "식약처 공개 레시피"), renderPublicRecipes(estimate.publicRecipes, count, estimate.method === "public_recipe", update));
  }
  if (references.length) {
    result.append(line("h2", "동일 메뉴 참고가"));
    const list = document.createElement("ul");
    list.className = "price-list";
    for (const reference of references) {
      list.append(priceRow(exact.name, reference, basis?.reference === reference ? "기준가 반영" : ""));
    }
    result.append(list);
  }
  if (similar.length) {
    result.append(line("h2", "유사 메뉴 참고가"));
    const list = document.createElement("ul");
    list.className = "price-list";
    for (const row of similar) {
      list.append(priceRow(row.name, row.display, row.reason + (row.used ? " · 시세 추정에 반영" : "")));
    }
    result.append(list);
  }
}
</script>
</html>
